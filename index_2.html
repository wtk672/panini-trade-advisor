<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Panini Trade Advisor</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg:#f6f1e7; --card:#fffdf8; --ink:#121826; --muted:#687083; --line:#e4dac9;
      --blue:#1849a9; --blueSoft:#e8efff; --green:#087443; --greenSoft:#ddf7ea;
      --yellow:#a15c00; --yellowSoft:#fff1cc; --red:#b42318; --redSoft:#fee4e2;
      --shadow:0 8px 28px rgba(34,24,8,.08);
    }
    * { box-sizing:border-box; }
    body {
      margin:0; background:linear-gradient(180deg,#fbf8f0,var(--bg)); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,Segoe UI,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .app { max-width:1120px; margin:0 auto; padding:16px 14px 90px; }
    .hero {
      position:sticky; top:0; z-index:5; margin:-16px -14px 14px; padding:16px 14px 12px;
      background:rgba(246,241,231,.92); backdrop-filter: blur(14px); border-bottom:1px solid rgba(228,218,201,.75);
    }
    .heroTop { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; max-width:1120px; margin:0 auto; }
    h1 { margin:0 0 4px; font-size:25px; letter-spacing:-.03em; }
    .sub { color:var(--muted); font-size:14px; line-height:1.35; max-width:720px; }
    .pill { background:#fff; border:1px solid var(--line); border-radius:999px; padding:7px 10px; font-size:12px; white-space:nowrap; box-shadow:0 1px 0 rgba(0,0,0,.03); }
    .tabs { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:12px; max-width:1120px; }
    button, select, input, textarea { font:inherit; }
    button { border:1px solid var(--line); background:#fff; border-radius:14px; padding:11px 12px; cursor:pointer; min-height:44px; }
    button.primary { background:var(--ink); color:white; border-color:var(--ink); }
    button.active { background:var(--blueSoft); border-color:#adc1f6; color:#153e90; font-weight:800; }
    button.ghost { background:transparent; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap:14px; min-width:0; }
    .grid > .panel { min-width:0; }
    .controls > * { min-width:0; }
    .quick { display:flex; gap:8px; overflow:auto; padding:2px 0 10px; -webkit-overflow-scrolling:touch; min-width:0; }
    @media (max-width: 860px) {
      .grid { grid-template-columns:1fr; }
      .heroTop { flex-direction:column; }
      h1 { font-size:23px; }
      .pill { display:none; }
    }
    .panel { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:14px; box-shadow:var(--shadow); }
    .panel h2 { margin:0 0 10px; font-size:17px; letter-spacing:-.01em; }
    .controls { display:grid; grid-template-columns:1fr 105px; gap:8px; margin-bottom:10px; }
    .search { width:100%; border:1px solid var(--line); border-radius:14px; padding:11px 12px; background:#fff; min-height:44px; }
    .quick button { white-space:nowrap; padding:8px 10px; min-height:36px; border-radius:999px; font-size:13px; }
    .list { max-height:52vh; overflow:auto; display:flex; flex-direction:column; gap:8px; padding-right:2px; -webkit-overflow-scrolling:touch; }
    @media (max-width:860px){ .list { max-height:42vh; } }
    .row { border:1px solid var(--line); border-radius:16px; padding:11px; display:flex; justify-content:space-between; gap:10px; align-items:center; background:#fff; }
    .row.selected { border-color:#7b9df2; background:#f0f4ff; box-shadow:0 0 0 2px rgba(123,157,242,.18) inset; }
    .label { font-weight:750; line-height:1.25; }
    .meta { color:var(--muted); font-size:12px; margin-top:3px; }
    .qty { min-width:42px; text-align:center; border-radius:999px; background:#f0ece3; padding:5px 8px; font-size:13px; font-weight:800; }
    .result { display:flex; flex-direction:column; gap:12px; }
    .summaryBox { border:1px solid var(--line); background:#fff; border-radius:18px; padding:12px; }
    .wantedChips { display:flex; flex-wrap:wrap; gap:7px; margin-top:8px; }
    .tradeCard { border:1px solid var(--line); border-radius:20px; padding:14px; background:#fff; }
    .tradeCard.best { border-color:#95d7b4; background:#f3fbf7; }
    .badge { display:inline-flex; padding:5px 8px; border-radius:999px; font-size:12px; font-weight:850; margin-bottom:8px; }
    .fair { background:var(--greenSoft); color:var(--green); }
    .generous { background:var(--yellowSoft); color:var(--yellow); }
    .bad { background:var(--redSoft); color:var(--red); }
    .cards { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
    .chip { border:1px solid var(--line); border-radius:999px; padding:8px 10px; background:#fff; font-weight:650; font-size:14px; }
    .score { color:var(--muted); font-size:13px; line-height:1.35; }
    .empty { border:1px dashed #d5c8b5; background:#fffaf0; color:#6a4b0a; border-radius:18px; padding:14px; font-size:14px; line-height:1.4; }
    .note { background:#fff7db; border:1px solid #ecd38d; border-radius:18px; padding:12px; color:#5a4100; font-size:13px; line-height:1.4; margin-bottom:12px; }
    .small { font-size:12px; color:var(--muted); line-height:1.4; }
    .inventoryTools { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .invTable { width:100%; border-collapse:separate; border-spacing:0 8px; }
    .invTable th { text-align:left; font-size:12px; color:var(--muted); font-weight:700; padding:0 8px; }
    .invTable td { background:#fff; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:9px 8px; font-size:13px; }
    .invTable td:first-child { border-left:1px solid var(--line); border-radius:14px 0 0 14px; }
    .invTable td:last-child { border-right:1px solid var(--line); border-radius:0 14px 14px 0; }
    .stepper { display:flex; align-items:center; gap:6px; justify-content:flex-end; }
    .stepper button { min-height:32px; width:32px; padding:0; border-radius:10px; font-weight:900; }
    .bottomBar {
      position:fixed; bottom:0; left:0; right:0; z-index:10; background:rgba(255,253,248,.94);
      border-top:1px solid var(--line); backdrop-filter: blur(14px); padding:10px 12px calc(10px + env(safe-area-inset-bottom));
      display:none;
    }
    @media (max-width:860px){ .bottomBar { display:block; } }
    .bottomBar button { width:100%; }
    .copyBox { width:100%; min-height:120px; border:1px solid var(--line); border-radius:16px; padding:12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const FLAGS = {
  Mexico:"🇲🇽", "South Africa":"🇿🇦", Korea:"🇰🇷", Czechia:"🇨🇿", Canada:"🇨🇦", "Bosnia & Herzegovina":"🇧🇦",
  Qatar:"🇶🇦", Switzerland:"🇨🇭", Brazil:"🇧🇷", Morocco:"🇲🇦", Haiti:"🇭🇹", Scotland:"🏴", USA:"🇺🇸",
  Paraguay:"🇵🇾", Australia:"🇦🇺", Türkiye:"🇹🇷", Germany:"🇩🇪", Curaçao:"🇨🇼", "Côte d’Ivoire":"🇨🇮",
  Ecuador:"🇪🇨", Netherlands:"🇳🇱", Japan:"🇯🇵", Sweden:"🇸🇪", Tunisia:"🇹🇳", Belgium:"🇧🇪", Egypt:"🇪🇬",
  Iran:"🇮🇷", "New Zealand":"🇳🇿", Spain:"🇪🇸", "Cabo Verde":"🇨🇻", "Saudi Arabia":"🇸🇦", Uruguay:"🇺🇾",
  France:"🇫🇷", Senegal:"🇸🇳", Iraq:"🇮🇶", Norway:"🇳🇴", Argentina:"🇦🇷", Algeria:"🇩🇿", Austria:"🇦🇹",
  Jordan:"🇯🇴", Portugal:"🇵🇹", "Congo DR":"🇨🇩", Uzbekistan:"🇺🇿", Colombia:"🇨🇴", England:"🏴",
  Croatia:"🇭🇷", Ghana:"🇬🇭", Panama:"🇵🇦", FIFA:"🏆"
};
const TYPE_LABEL = { normal:"Normal", "blue-border":"Blue border", team:"Team", historic:"Historic", "foil-crest":"Foil crest", special:"Special" };
const TYPE_VALUE = { normal:1, "blue-border":1.5, team:2, historic:3, "foil-crest":4, special:5 };
function valueFor(type){ return TYPE_VALUE[type] || 1; }
function makeId(country,name,type){ return `${country}-${name}-${type}`.replaceAll(" ","_"); }

const missingSeed = [
  ["Mexico",[3,11,12,16,20]], ["Korea",[5,7,9,11,13,17,18]], ["Czechia",[6,11,12,17,20]],
  ["Canada",[1,2,5,11,13,15,18,20]], ["Bosnia & Herzegovina",[8,13,16,17]], ["Qatar",[5,9,11,14,17]], ["Switzerland",[5,7,11,12,13,14,15]],
  ["Brazil",[8,12]], ["Morocco",[7,10,17,20]], ["Haiti",[3,7,9,10,12]], ["Scotland",[5,10,11,18,20]],
  ["USA",[2,4,11,14,16]], ["Paraguay",[4,6,7,19,20]], ["Australia",[4,5,7,12,14]], ["Türkiye",[1,5,6,7,8,9,13,16,17]],
  ["Germany",[1,2,4,13,14,17,18,20]], ["Curaçao",[4,5,7,13,15,17,20]], ["Côte d’Ivoire",[1,2,10,16]], ["Ecuador",[13,15,16,17,19]],
  ["Netherlands",[3,5,6,10,11,18,19,20]], ["Japan",[3,7,13,16]], ["Sweden",[5,6,11,12,15,16,17,19]], ["Tunisia",[2,3,6,7,10,11,13,18,20]],
  ["Belgium",[3,8]], ["Egypt",[3,4,5,12,14,17,18]], ["Iran",[7,9,10,16,18]], ["New Zealand",[4,5,6,7,9,13,14,15,16]],
  ["Spain",[15]], ["Cabo Verde",[2,3,10]], ["Saudi Arabia",[1,4,5,7,13,18]], ["Uruguay",[1,18]],
  ["Senegal",[7]], ["Iraq",[3,4,5,6,9,13,17]], ["Norway",[4,6,9]],
  ["Argentina",[3,4,9,13]], ["Algeria",[6,8,10,11,16,18,19]], ["Austria",[3,6,7,11,14,15,20]], ["Jordan",[1,12,13,16]],
  ["Portugal",[4]], ["Congo DR",[5,6,11,19]], ["Uzbekistan",[4,7,8,20]], ["Colombia",[7,9,16,17,18,20]],
  ["England",[6,8,12,14]], ["Croatia",[3,4,11,14]], ["Ghana",[3,6,7,8,12,14]], ["Panama",[3,5,6,8,9]]
].flatMap(([country, nums]) => nums.map(n => ({ id:makeId(country,`#${n}`,"normal"), country, name:`#${n}`, type:"normal", qty:1, value:1 })));

const duplicateSeedRaw = [
  ["Switzerland","Breel Embolo","normal",1],["Switzerland","Zeki Amdouni","normal",1],["Switzerland","Granit Xhaka","normal",3],["Switzerland","Yvon Mvogo","normal",1],["Switzerland","Ruben Vargas","normal",1],["Switzerland","Fabian Rieder","normal",1],
  ["Uruguay","José María Giménez","normal",2],["Uruguay","Darwin Núñez","normal",1],["Uruguay","Nicolás de la Cruz","normal",1],["Uruguay","Giorgian de Arrascaeta","normal",1],
  ["Senegal","Édouard Mendy","normal",3],["Senegal","Yehvann Diouf","normal",1],["Senegal","Kalidou Koulibaly","normal",2],["Senegal","Abdoulaye Seck","normal",1],
  ["Morocco","Adam Masina","normal",1],["Morocco","Ayoub El Kaabi","normal",1],["Morocco","Noussair Mazraoui","normal",1],["Morocco","Team Photo","team",1],
  ["Türkiye","Zeki Çelik","normal",1],["Türkiye","Kerem Aktürkoğlu","normal",1],["Türkiye","Mert Müldür","normal",1],["Türkiye","Uğurcan Çakır","normal",1],
  ["Bosnia & Herzegovina","Amar Dedić","normal",1],["Bosnia & Herzegovina","Nikola Katić","normal",1],["Bosnia & Herzegovina","Benjamin Tahirović","normal",1],
  ["Japan","Takefusa Kubo","normal",1],["Japan","Hidemasa Morita","normal",1],["Japan","Koki Ogawa","normal",1],["Japan","Crest Foil","foil-crest",1],
  ["England","Phil Foden","normal",1],["England","Marcus Rashford","normal",1],["England","Ezri Konsa","normal",1],["England","Jude Bellingham","normal",1],["England","Reece James","normal",1],["England","Jordan Pickford","normal",1],
  ["France","Désiré Doué","normal",1],["France","Michael Olise","blue-border",1],["France","Lucas Digne","normal",1],["France","Christopher Nkunku","normal",1],["France","Team Photo","team",1],["France","Crest Foil","foil-crest",1],
  ["Croatia","Ivan Perišić","normal",1],["Croatia","Ante Budimir","normal",1],["Croatia","Petar Sučić","normal",1],["Croatia","Crest Foil","foil-crest",1],
  ["Ghana","Daniel Amartey","normal",1],["Ghana","Jordan Ayew","normal",1],["Ghana","Iñaki Williams","normal",1],
  ["Panama","José Fajardo","blue-border",1],["Panama","Alberto Carrasquilla","normal",1],["Panama","Team Photo","team",1],
  ["Côte d’Ivoire","Seko Fofana","normal",1],["Côte d’Ivoire","Odilon Kossounou","normal",1],["Côte d’Ivoire","Christ Koffi","normal",1],
  ["Iraq","Aymen Hussein","blue-border",1],["Iraq","Manaf Younis","normal",1],["Iraq","Amir Sher","normal",1],["Iraq","Crest Foil","foil-crest",1],
  ["Haiti","Danley Jean Jacques","normal",1],["Haiti","Nader Nahir","normal",1],["Haiti","Christopher Attys","normal",1],["Haiti","Team Photo","team",1],
  ["Mexico","Team Photo","team",1],["Mexico","Crest Foil","foil-crest",1],["Mexico","José Sánchez","normal",1],
  ["Brazil","Estêvão","blue-border",1],["Brazil","Team 1994","historic",1],["Brazil","Team Photo","team",1],
  ["Belgium","Jérémy Doku","normal",1],["Belgium","Romelu Lukaku","normal",1],["Belgium","Youri Tielemans","normal",1],["Belgium","Team Photo","team",1],
  ["USA","Haji Wright","normal",1],["USA","Cameron Carter-Vickers","normal",1],["USA","Team Photo","team",1],
  ["Argentina","Cristian Romero","normal",1],["Argentina","Lionel Messi","normal",1],
  ["Canada","Jonathan David","normal",1],["Canada","Team Photo","team",1],
  ["Sweden","Viktor Gyökeres","normal",1],["Sweden","Alexander Isak","normal",1],["Sweden","Crest Foil","foil-crest",1],
  ["FIFA","World Cup Trophy Blue","special",1],["FIFA","World Cup Trophy Red","special",1],["FIFA","World Cup Trophy Green","special",1],["FIFA","Mascot / Logo Special","special",1]
];
const duplicateSeed = duplicateSeedRaw.map(([country,name,type,qty]) => ({ id:makeId(country,name,type), country, name, type, qty, value:valueFor(type) }));

function labelFor(s) { return `${FLAGS[s.country] || ""} ${s.country} — ${s.name}`; }
function score(items) { return items.reduce((sum, s) => sum + (s.value || valueFor(s.type)), 0); }
function expandedInventory(items) {
  const out = [];
  items.forEach(s => { for (let i=0;i<(s.qty||1);i++) out.push({...s, copy:i, uid:`${s.id}-${i}`}); });
  return out;
}
function combos(items, maxLen=3) {
  const exp = expandedInventory(items);
  const res = [];
  for (let i=0;i<exp.length;i++) res.push([exp[i]]);
  for (let i=0;i<exp.length;i++) for (let j=i+1;j<exp.length;j++) if (exp[i].id !== exp[j].id || items.find(x=>x.id===exp[i].id)?.qty > 1) res.push([exp[i],exp[j]]);
  if (maxLen >= 3) {
    for (let i=0;i<exp.length;i++) for (let j=i+1;j<exp.length;j++) for (let k=j+1;k<exp.length;k++) res.push([exp[i],exp[j],exp[k]]);
  }
  return res;
}
function hashStr(s){
  let h = 0;
  for (let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function recommend(targets, inventory) {
  const targetScore = score(targets);
  if (!targetScore) return [];
  const maxLen = targetScore >= 4 ? 3 : 2;
  const seen = new Set();
  const targetKey = targets.map(t=>t.id).sort().join("|") || "seed";
  const seedHash = hashStr(targetKey);
  return combos(inventory.filter(x=>x.qty>0), maxLen)
    .map(c => {
      const key = c.map(x=>x.id).sort().join("|");
      if (seen.has(key)) return null; seen.add(key);
      const offer = score(c);
      const diff = Math.abs(offer - targetScore);
      const lowQtyPenalty = c.some(x => (inventory.find(i=>i.id===x.id)?.qty || 1) <= 1) ? .3 : 0;
      const simplePenalty = (c.length - 1) * .18;
      const overpayPenalty = offer > targetScore ? .05 : 0;
      // Deterministic jitter: among options that are genuinely equally fair (same real
      // rank), this spreads which one comes up first based on *which* card was asked
      // for. Same request always gives the same answer; different requests of equal
      // value no longer all collapse onto the one or two most-stocked duplicates.
      const jitter = ((hashStr(key) + seedHash) % 97) / 10000;
      return { cards:c, offer, target:targetScore, diff, rank: diff + lowQtyPenalty + simplePenalty + overpayPenalty + jitter };
    }).filter(Boolean)
    .sort((a,b) => a.rank - b.rank)
    .slice(0,6);
}
function fairness(r) {
  const pct = Math.abs(r.offer-r.target)/Math.max(r.target,1);
  if (pct <= .15) return ["Fair", "fair"];
  if (r.offer > r.target) return ["Generous", "generous"];
  return ["Too low", "bad"];
}
function tradeText(targets, recs, inverse){
  if (!targets.length || !recs.length) return "";
  const target = targets.map(labelFor).join(", ");
  const best = recs[0].cards.map(labelFor).join(" + ");
  const backup = recs[1] ? recs[1].cards.map(labelFor).join(" + ") : "";
  return `${inverse ? "Someone wants" : "We want"}: ${target}\n${inverse ? "Ask for" : "Offer"}: ${best}${backup ? `\nBackup: ${backup}` : ""}`;
}

function Selector({title, items, selected, setSelected, allowQty=false}) {
  const [q,setQ] = React.useState("");
  const [type,setType] = React.useState("all");
  const countries = [...new Set(items.map(x=>x.country))].slice(0,20);
  const filtered = items.filter(s => {
    const hay = `${s.country} ${s.name} ${s.type}`.toLowerCase();
    return hay.includes(q.toLowerCase()) && (type==="all" || s.type===type);
  });
  function toggle(s) {
    setSelected(prev => prev.some(x=>x.id===s.id) ? prev.filter(x=>x.id!==s.id) : [...prev, s]);
  }
  return <div className="panel">
    <h2>{title}</h2>
    <div className="controls">
      <input className="search" value={q} onChange={e=>setQ(e.target.value)} placeholder="Search country, player, sticker…" />
      <select className="search" value={type} onChange={e=>setType(e.target.value)}>
        <option value="all">All</option><option value="normal">Normal</option><option value="blue-border">Blue</option><option value="team">Team</option><option value="foil-crest">Foil</option><option value="special">Special</option>
      </select>
    </div>
    <div className="quick">
      <button className={q===""?"active":""} onClick={()=>setQ("")}>All</button>
      {countries.map(c=><button key={c} className={q===c?"active":""} onClick={()=>setQ(c)}>{FLAGS[c]} {c}</button>)}
    </div>
    <div className="list">
      {filtered.map(s => {
        const is = selected.some(x=>x.id===s.id);
        return <div key={s.id} onClick={()=>toggle(s)} className={"row "+(is?"selected":"")}>
          <div><div className="label">{labelFor(s)}</div><div className="meta">{TYPE_LABEL[s.type] || s.type} · {s.value || valueFor(s.type)} pts</div></div>
          {allowQty && <div className="qty">×{s.qty}</div>}
        </div>
      })}
    </div>
  </div>
}

function Results({targets, inventory, inverse=false, onConfirm}) {
  const recs = recommend(targets, inventory);
  const text = tradeText(targets, recs, inverse);
  async function copy(){
    try { await navigator.clipboard.writeText(text); alert("Copied trade text."); } catch(e) {}
  }
  return <div className="panel result">
    <h2>{inverse ? "Ask for this in return" : "Suggested fair offer"}</h2>
    {!targets.length && <div className="empty">Pick one or more stickers. The app will return one best trade plus backups.</div>}
    {!!targets.length && <div className="summaryBox">
      <div className="small">{inverse ? "Someone wants:" : "Selected target:"}</div>
      <div className="wantedChips">{targets.map(x=><span className="chip" key={x.id}>{labelFor(x)}</span>)}</div>
      <div className="small" style={{marginTop:8}}>Target value: <b>{score(targets)} pts</b></div>
    </div>}
    {recs.map((r,i) => {
      const [txt, cls] = fairness(r);
      return <div key={i} className={"tradeCard "+(i===0?"best":"")}>
        <span className={"badge "+cls}>{i===0 ? "Best: " : `Backup ${i}: `}{txt}</span>
        <div className="cards">{r.cards.map((c,idx)=><span className="chip" key={idx}>{labelFor(c)}</span>)}</div>
        <div className="score">Offer value {r.offer} pts vs target {r.target} pts. {r.offer > r.target ? "Slightly generous." : r.offer < r.target ? "Slightly light." : "Exact match."}</div>
        {i===0 && onConfirm && <button className="primary" style={{marginTop:10, width:"100%"}} onClick={()=>onConfirm(r)}>✅ This trade happened — update my counts</button>}
      </div>
    })}
    {!!text && <button onClick={copy}>Copy trade message</button>}
  </div>
}

function Inventory({dups,setDups,missing,setMissing}) {
  const [q,setQ] = React.useState("");
  const [mode,setMode] = React.useState("dups");
  const items = mode==="dups" ? dups : missing;
  const setItems = mode==="dups" ? setDups : setMissing;
  const filtered = items.filter(s => `${s.country} ${s.name} ${s.type}`.toLowerCase().includes(q.toLowerCase()));
  function changeQty(id, delta){
    setItems(prev => prev.map(s => s.id===id ? {...s, qty: Math.max(0,(s.qty||1)+delta)} : s));
  }
  function exportData(){
    const data = JSON.stringify({duplicates:dups, missing}, null, 2);
    navigator.clipboard?.writeText(data);
    alert("Inventory JSON copied.");
  }
  return <div className="panel">
    <h2>Inventory</h2>
    <div className="note">Use this to correct the photo-seeded inventory. Changes save on this phone/browser automatically.</div>
    <div className="inventoryTools">
      <button className={mode==="dups"?"active":""} onClick={()=>setMode("dups")}>Duplicates</button>
      <button className={mode==="missing"?"active":""} onClick={()=>setMode("missing")}>Missing</button>
      <button onClick={exportData}>Copy backup</button>
      <button className="ghost" onClick={()=>{localStorage.removeItem("panini-v2"); location.reload();}}>Reset</button>
    </div>
    <input className="search" value={q} onChange={e=>setQ(e.target.value)} placeholder="Search inventory…" style={{marginBottom:10}} />
    <table className="invTable">
      <thead><tr><th>Sticker</th><th>Type</th><th style={{textAlign:"right"}}>Qty</th></tr></thead>
      <tbody>
        {filtered.map(s=><tr key={s.id}>
          <td><b>{labelFor(s)}</b><div className="small">{s.value || valueFor(s.type)} pts</div></td>
          <td>{TYPE_LABEL[s.type] || s.type}</td>
          <td><div className="stepper"><button onClick={()=>changeQty(s.id,-1)}>−</button><b>{s.qty}</b><button onClick={()=>changeQty(s.id,1)}>+</button></div></td>
        </tr>)}
      </tbody>
    </table>
  </div>
}

function App() {
  const saved = (()=>{ try { return JSON.parse(localStorage.getItem("panini-v2")); } catch(e){ return null; }})();
  const [dups,setDups] = React.useState(saved?.duplicates || duplicateSeed);
  const [missing,setMissing] = React.useState(saved?.missing || missingSeed);
  const [tab,setTab] = React.useState("want");
  const [want,setWant] = React.useState([]);
  const [asked,setAsked] = React.useState([]);

  React.useEffect(()=>localStorage.setItem("panini-v2", JSON.stringify({duplicates:dups,missing})),[dups,missing]);

  function removeMissingByIds(ids){
    const idSet = new Set(ids);
    setMissing(prev => prev.filter(s => !idSet.has(s.id)));
  }
  function decrementDupsByIds(ids){
    const counts = {};
    ids.forEach(id => counts[id] = (counts[id]||0)+1);
    setDups(prev => prev.map(s => counts[s.id] ? {...s, qty: Math.max(0,(s.qty||1)-counts[s.id])} : s));
  }
  function confirmWantTrade(rec){
    removeMissingByIds(want.map(x=>x.id));
    decrementDupsByIds(rec.cards.map(x=>x.id));
    setWant([]);
    alert("Nice trade! Updated: got what you wanted, gave away the offered cards.");
  }
  function confirmAskedTrade(rec){
    decrementDupsByIds(asked.map(x=>x.id));
    removeMissingByIds(rec.cards.map(x=>x.id));
    setAsked([]);
    alert("Nice trade! Updated: gave away your doubles, got the new cards in return.");
  }

  return <div className="app">
    <div className="hero">
      <div className="heroTop">
        <div>
          <h1>⚽ Panini Trade Advisor</h1>
          <div className="sub">Pick what he wants, get a fair offer. Or pick what another kid wants, and see what he should ask for.</div>
        </div>
        <div className="pill">{dups.reduce((a,b)=>a+(b.qty||0),0)} duplicate stickers</div>
      </div>
      <div className="tabs">
        <button className={tab==="want"?"active":""} onClick={()=>setTab("want")}>I want</button>
        <button className={tab==="asked"?"active":""} onClick={()=>setTab("asked")}>Someone wants</button>
        <button className={tab==="inventory"?"active":""} onClick={()=>setTab("inventory")}>Inventory</button>
      </div>
    </div>

    {tab==="want" && <div className="grid">
      <Selector title="Select sticker(s) he wants" items={missing.filter(x=>x.qty>0)} selected={want} setSelected={setWant}/>
      <Results targets={want} inventory={dups} onConfirm={confirmWantTrade}/>
    </div>}

    {tab==="asked" && <div className="grid">
      <Selector title="Select sticker(s) someone wants from his doubles" items={dups.filter(x=>x.qty>0)} selected={asked} setSelected={setAsked} allowQty/>
      <Results targets={asked} inventory={missing} inverse onConfirm={confirmAskedTrade}/>
    </div>}

    {tab==="inventory" && <Inventory dups={dups} setDups={setDups} missing={missing} setMissing={setMissing}/>}

    <div className="bottomBar">
      <button className="primary" onClick={()=>window.scrollTo({top:0,behavior:"smooth"})}>Back to top</button>
    </div>
  </div>
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
